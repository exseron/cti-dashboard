services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The app is only reachable through Caddy on the internal network.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - cti-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cti-data:
  caddy-data:
  caddy-config:
